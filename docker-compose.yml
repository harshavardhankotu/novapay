version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: revolut-postgres
    environment:
      POSTGRES_USER: revolut
      POSTGRES_PASSWORD: revolut123
      POSTGRES_DB: revolut_india
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revolut"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: revolut-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://revolut:revolut123@postgres:5432/revolut_india"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
